<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Two Numbers</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background:#f5f5f5;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .container{
            background:white;
            padding:50px;
            border-radius:15px;

            box-shadow:0px 4px 15px rgba(0,0,0,0.1);

            text-align:center;
            width:500px;
        }

        h1{
            margin-bottom:40px;
            font-size:42px;
        }

        .input-group{
            display:flex;
            gap:18px;
            justify-content:center;
            margin-bottom:30px;
        }

        input{
            padding:15px;
            width:150px;

            font-size:20px;

            border:1px solid #ccc;
            border-radius:8px;

            outline:none;
        }

        button{
            padding:15px 30px;
            background:#2563eb;
            color:white;

            border:none;
            border-radius:8px;

            font-size:20px;
            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:30px;
            font-size:35px;
            font-weight:bold;
            color:green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Add Two Numbers</h1>

        <div class="input-group">
            <input type="number" id="num1" placeholder="First Number">

            <input type="number" id="num2" placeholder="Second Number">
        </div>

        <button onclick="addNumbers()">Add</button>

        <div id="result"></div>

    </div>

    <script>

        async function addNumbers(){

            let a = document.getElementById("num1").value;
            let b = document.getElementById("num2").value;

            if(a === "" || b === ""){
                alert("Please enter both numbers");
                return;
            }

            let response = await fetch(`http://127.0.0.1:8000/add?a=${a}&b=${b}`);

            let data = await response.json();

            document.getElementById("result").innerHTML =
                "Result: " + data.result;
        }

    </script>

</body>
</html>
